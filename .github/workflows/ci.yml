name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install FUSE
        run: sudo apt-get install -y fuse3 libfuse3-dev

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...
